<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="g">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gs">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Outer glow for star -->
  <polygon points="64,6 76,44 114,44 82,66 92,104 64,82 36,104 46,66 14,44 52,44"
    fill="#ffd700" opacity="0.15" filter="url(#gs)"/>

  <!-- 6-pointed star (the board) - bold & clean -->
  <polygon points="64,12 76,44 110,44 82,64 92,98 64,78 36,98 46,64 18,44 52,44"
    fill="url(#star)" stroke="#fff3" stroke-width="1" stroke-linejoin="round" filter="url(#g)"/>

  <!-- Inner hex (center area) -->
  <polygon points="64,36 80,50 80,70 64,84 48,70 48,50"
    fill="#1a1a2e" stroke="#ffd70066" stroke-width="1.5"/>

  <!-- Red piece (top) -->
  <circle cx="64" cy="22" r="7" fill="#e74c3c" stroke="#fff" stroke-width="2"/>

  <!-- Blue piece (bottom) -->
  <circle cx="64" cy="90" r="7" fill="#3498db" stroke="#fff" stroke-width="2"/>

  <!-- Green piece (right) -->
  <circle cx="100" cy="52" r="6" fill="#2ecc71" stroke="#fff" stroke-width="1.5"/>

  <!-- Purple piece (left) -->
  <circle cx="28" cy="52" r="6" fill="#9b59b6" stroke="#fff" stroke-width="1.5"/>

  <!-- Center piece - golden star (法师) -->
  <circle cx="64" cy="58" r="9" fill="#f1c40f" stroke="#fff" stroke-width="2"/>
  <text x="64" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a2e" font-family="sans-serif">★</text>
</svg>
